<!--
  A runner's detail page, which carries the finish time the search list omits.
  Names and ids are fictional.
-->
<div class="detail">
  <h2>Person Details</h2>
  <div class="detail-box box-general" id="detail-box-general">
    <h3>Participant</h3>
    <table class="table table-condensed">
      <tbody>
        <tr class=" f-__fullname"><th class="desc">Name</th><td class="f-__fullname last">Ninguém, Zé (GER)</td></tr>
        <tr class=" f-start_no"><th class="desc">Bib Number</th><td class="f-start_no last">914</td></tr>
      </tbody>
    </table>
  </div>
  <div class="detail-box box-totals" id="detail-box-totals">
    <h3>Result</h3>
    <table class="table table-condensed">
      <tbody>
        <tr class=" f-place_all"><th class="desc">Place</th><td class="f-place_all last">401</td></tr>
        <tr class="list-highlight f-place_age"><th class="desc">Place (g)</th><td class="f-place_age last">108</td></tr>
        <tr class=" f-place_nosex"><th class="desc">Place (Total)</th><td class="f-place_nosex last">421</td></tr>
        <tr class="list-highlight f-time_finish_netto"><th class="desc">Time Total</th><td class="f-time_finish_netto last">03:12:23</td></tr>
        <tr class=" f-time_finish_brutto"><th class="desc">Finish Time (Gun)</th><td class="f-time_finish_brutto last">03:12:34</td></tr>
      </tbody>
    </table>
  </div>
  <div class="detail-box box-splits" id="detail-box-splits">
    <h3>Splits</h3>
    <table class="table table-condensed table-striped">
      <tbody>
        <tr class=" f-time_02"><th class="desc">KM 5</th><td class="time_day">09:21:18</td><td class="time">00:20:59</td></tr>
      </tbody>
    </table>
  </div>
</div>
